    {

      "@graph": [
        {
          "@type": "WebApplication",
          "name": "CreatorPlaybooks",
          "url": "https://creatorplaybooks.netlify.app",
          "applicationCategory": "EducationalApplication",
          "operatingSystem": "Web",

            "@type": "Offer",

          },
          "creator": {
            "@type": "Person",
            "name": "Neal Frazier",
            "url": "https://nealfrazier.tech"
          }
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What is CreatorPlaybooks?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "CreatorPlaybooks is a curated reading list and mentor playbook directory of 35+ public builders across 20 cities, complete with playable JSON APIs and Markdown export."
              }
            },
            {
              "@type": "Question",
              "name": "Is CreatorPlaybooks free and open access?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Every mentor playbook, the dashboard, the API docs, and the Markdown export are free."
              }
            }
          ]
        }
      ]
    }

  </head>
  <body>
    <div id="boot">
      <section class="home-hero">
        <div class="home-hero-content">
          <h1 class="home-headline">
            <span class="home-headline-line">Notes from builders</span>
            <em>who do not all live in one city.</em>
          </h1>
          <p class="home-subhead">CreatorPlaybooks is a reading list. The people in it post from Austin, Dubai, Barcelona, Bengaluru, Singapore, Atlanta, and the other places named on their profiles. Each page says what they are doing now, and where that sentence came from.</p>
        </div>
      </section>
    </div>
    <div id="root"></div>
    <script>
      const boot = document.getElementById('boot');
      const root = document.getElementById('root');
      const hideBoot = () => { if (root.childElementCount) boot.remove(); };
      new MutationObserver(hideBoot).observe(root, { childList: true });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
