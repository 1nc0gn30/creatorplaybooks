    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 24px;
        background: #0a0a0f;
        color: #f4f4f7;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        z-index: 1;
      }
      #boot .boot-card {
        max-width: 680px;
        text-align: center;
      }
      #boot h1 {
        font-family: "Iowan Old Style", Palatino, Georgia, serif;
        font-size: clamp(2rem, 5vw, 3.2rem);
        font-weight: 500;
        line-height: 1.1;
        margin: 0 0 14px;
      }
      #boot p {
        margin: 0;
        line-height: 1.6;
        color: #c4c4d0;
      }
      [data-theme="light"] #boot {
        background: #faf8f3;
        color: #101828;
      }
      [data-theme="light"] #boot p {
        color: #475467;
      }
    </style>
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var q = params.get('theme');
          var stored = localStorage.getItem('creatorplaybooks_theme');
          var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme = (q === 'light' || q === 'dark') ? q : ((stored === 'light' || stored === 'dark') ? stored : (prefersLight ? 'light' : 'dark'));
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>

              }

  <body>
    <div id="boot">
      <section class="boot-card">
        <h1>Notes from builders <em>who do not all live in one city.</em></h1>
        <p>CreatorPlaybooks is a reading list of 35 public builders across 20 cities with 115 repeatable plays, local JSON APIs, and offline exports.</p>
      </section>
    </div>
    <div id="root"></div>
    <script>
      const boot = document.getElementById('boot');
      const root = document.getElementById('root');
      const hideBoot = () => { if (root && root.childElementCount && boot) boot.remove(); };
      if (root) new MutationObserver(hideBoot).observe(root, { childList: true });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
