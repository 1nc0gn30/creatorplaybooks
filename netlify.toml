[dev]
  framework = "#custom"
  command = "npm run dev"
  targetPort = 5185
  port = 8888

[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://unavatar.io https://pbs.twimg.com; font-src 'self' data:; connect-src 'self' https://creatorplaybooks.netlify.app; frame-ancestors 'self' https://zoth.nullai.tech http://127.0.0.1:3000 http://localhost:3000; object-src 'none'; base-uri 'self'"

[[redirects]]
  from = "/api/x"
  to = "/.netlify/functions/x-data"
  status = 200

[[redirects]]
  from = "/api/export"
  to = "/.netlify/functions/export"
  status = 200

[[redirects]]
  from = "/api/members"
  to = "/.netlify/functions/members"
  status = 200

[[redirects]]
  from = "/api/profile"
  to = "/.netlify/functions/profile"
  status = 200

[[redirects]]
  from = "/api/sync"
  to = "/.netlify/functions/sync"
  status = 200

[[redirects]]
  from = "/api/sync-status"
  to = "/.netlify/functions/sync"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
